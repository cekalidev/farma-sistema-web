name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Una ejecución por rama/PR; solo se cancelan las de PR (nunca un despliegue en curso)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  VP_GIT_HOOKS: '0'
  IMAGE_NAME: farma-sistema-web

jobs:
  calidad:
    name: Calidad (formato, lint, tipos, tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Instalar Vite+ y dependencias
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: '26'
          cache: true

      - name: vp check (formato + Oxlint + tipos)
        run: vp check

      - name: ESLint
        run: pnpm run lint:eslint

      - name: Typecheck (tsc)
        run: pnpm run typecheck

      - name: Tests (Vitest)
        run: vp test

      - name: Build de producción
        run: vp build

  imagen:
    name: Imagen Docker + smoke test
    needs: calidad
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      imagen: ${{ steps.meta.outputs.imagen }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Calcular nombre y tag
        id: meta
        env:
          REPO: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then tag="$REF_NAME"; else tag="sha-${SHA::12}"; fi
          imagen="ghcr.io/${REPO,,}/${IMAGE_NAME}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "imagen=$imagen" >> "$GITHUB_OUTPUT"

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build (sin push)
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: |
            ${{ steps.meta.outputs.imagen }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_NAME }}:ci
          build-args: |
            VITE_API_URL=/api/v1
            VITE_API_MOCKS=no
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test del contenedor
        run: |
          # "api" apunta a un puerto sin servicio: el proxy debe responder 502
          docker run -d --name web -p 8080:8080 --add-host api:127.0.0.1 "${IMAGE_NAME}:ci"
          for i in $(seq 1 30); do
            estado=$(docker inspect -f '{{.State.Health.Status}}' web)
            [ "$estado" = "healthy" ] && break
            sleep 2
          done
          docker inspect -f 'Health: {{.State.Health.Status}}' web
          [ "$estado" = "healthy" ]

          test "$(curl -fsS http://localhost:8080/healthz)" = "ok"
          curl -fsS -o /dev/null http://localhost:8080/
          curl -fsSI http://localhost:8080/ | grep -qi '^content-security-policy:'
          curl -fsS -o /dev/null http://localhost:8080/traslados/1
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/mockServiceWorker.js)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/auth/me)" = "502"
          test "$(docker exec web id -u)" != "0"
          echo "Smoke test OK"

      - name: Logs del contenedor
        if: always()
        run: docker logs web || true

      - name: Exportar imagen
        if: github.event_name == 'push'
        env:
          REF: ${{ steps.meta.outputs.imagen }}:${{ steps.meta.outputs.tag }}
        run: docker save "$REF" | gzip > imagen.tar.gz

      - name: Guardar imagen como artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: imagen-web
          path: imagen.tar.gz
          retention-days: 5
          if-no-files-found: error

  deploy-staging:
    name: Deploy a staging (simulado)
    needs: imagen
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: staging
    steps:
      - name: Descargar imagen
        uses: actions/download-artifact@v8.0.2
        with:
          name: imagen-web

      - name: Cargar imagen
        run: gunzip -c imagen.tar.gz | docker load

      - name: Despliegue simulado
        env:
          IMAGEN: ${{ needs.imagen.outputs.imagen }}
          TAG: ${{ needs.imagen.outputs.tag }}
        run: |
          # Sin registro ni servidor reales: se describe lo que se haría.
          # Real: docker push "$IMAGEN:$TAG" y actualizar el servicio de staging.
          echo "Entorno: staging"
          echo "Imagen:  $IMAGEN:$TAG"
          docker image inspect "$IMAGEN:$TAG" --format 'Digest local: {{.Id}}  Tamaño: {{.Size}} bytes'
          {
            echo "### Deploy simulado a staging"
            echo "- Imagen: \`$IMAGEN:$TAG\`"
            echo "- Commit: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verificación post-deploy (simulada)
        env:
          IMAGEN: ${{ needs.imagen.outputs.imagen }}
          TAG: ${{ needs.imagen.outputs.tag }}
        run: |
          docker run -d --name staging -p 8080:8080 --add-host api:127.0.0.1 "$IMAGEN:$TAG"
          for i in $(seq 1 15); do curl -fsS http://localhost:8080/healthz && break; sleep 2; done
          docker rm -f staging

  deploy-produccion:
    name: Deploy a producción (simulado)
    needs: [imagen, deploy-staging]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Aprobación manual: en Settings > Environments > produccion activar
    # "Required reviewers" (y opcionalmente limitar a tags v*). El job queda
    # en espera hasta que un revisor lo apruebe.
    environment:
      name: produccion
    steps:
      - name: Despliegue simulado
        env:
          IMAGEN: ${{ needs.imagen.outputs.imagen }}
          TAG: ${{ needs.imagen.outputs.tag }}
        run: |
          # Real: promover la misma imagen validada en staging (sin reconstruir).
          echo "Entorno: produccion"
          echo "Imagen:  $IMAGEN:$TAG"
          {
            echo "### Deploy simulado a producción"
            echo "- Imagen: \`$IMAGEN:$TAG\`"
            echo "- Aprobado vía environment \`produccion\`"
          } >> "$GITHUB_STEP_SUMMARY"
